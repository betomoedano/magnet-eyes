name: MagnetEyes
options:
  bundleIdPrefix: dev.codewithbeto
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 2
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MagnetEyesCore:
    path: .
targets:
  MagnetEyes:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: MagnetEyesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.codewithbeto.magneteyes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Magnet Eyes
        INFOPLIST_KEY_NSMotionUsageDescription: Magnet Eyes uses the magnetic field sensor to animate its pupils. All readings stay on this iPhone.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
  MagnetEyesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MagnetEyes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.codewithbeto.magneteyes.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MagnetEyes:
    build:
      targets:
        MagnetEyes: all
    test:
      targets:
        - MagnetEyesUITests
